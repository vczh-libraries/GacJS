<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <title>GacUI HTML Renderer</title>
    <link rel="shortcut icon" href="/favicon.ico" />
    <link rel="stylesheet" type="text/css" href="./global.css" />
</head>

<body>
    <form id="connection-options">
        <label><input type="checkbox" id="option-rvmhost">rvmhost</label>
        <label><input type="checkbox" id="option-remoteDT">remoteDT</label>
        <label><input type="checkbox" id="option-remoteLocale">remoteLocale</label>
        <label><input type="checkbox" id="option-remoteFS">remoteFS</label>
        <label><input type="checkbox" id="option-corehost">corehost</label>
        <input id="option-host" aria-label="Core host" value="localhost" disabled>
        <button type="submit">REFRESH</button>
        <span id="connection-error" role="alert"></span>
    </form>
    <div id="gacui-screen" class="gacui-container" tabindex="0">
        <!-- Content goes here -->
    </div>
    <button id="gacui-exit">Exit</button>
    <button id="gacui-force-exit">Force Exit</button>

    <div id="gacui-error-mask" class="gacui-error-mask">
        <div class="gacui-error-cross"></div>
        <div id="gacui-error-message" class="gacui-mask-message"></div>
    </div>
    <div id="gacui-success-mask" class="gacui-success-mask">
        <div class="gacui-success-tick"></div>
        <div id="gacui-success-message" class="gacui-mask-message"></div>
    </div>
    <script type="module">
        import * as GacUIHtmlRenderer from "/entry.js";
        const connection = GacUIHtmlRenderer.parseConnectionOptions(location.href);
        const optionNames = ['rvmhost', 'remoteDT', 'remoteLocale', 'remoteFS', 'corehost'];
        const hostInput = document.getElementById('option-host');
        for (const name of optionNames) document.getElementById(`option-${name}`).checked = connection[name];
        hostInput.value = connection.host;
        hostInput.disabled = !connection.corehost;
        document.getElementById('option-corehost').onchange = event => { hostInput.disabled = !event.target.checked; };
        document.getElementById('connection-options').onsubmit = event => {
            event.preventDefault();
            const selected = { ...connection, host: hostInput.value };
            for (const name of optionNames) selected[name] = document.getElementById(`option-${name}`).checked;
            try {
                const url = GacUIHtmlRenderer.connectionOptionsUrl(location.href, selected);
                if (url === location.href) location.reload();
                else location.href = url;
            }
            catch (error) { document.getElementById('connection-error').textContent = error.message; }
        };
        let gacuiRenderer;
        document.getElementById('gacui-exit').onclick = () => gacuiRenderer?.requestStopToCore(false);
        document.getElementById('gacui-force-exit').onclick = () => gacuiRenderer?.requestStopToCore(true);

        import { installFullControlTestRawElements } from '/fullControlTestRaw.js';

        // Event bridges for Playwright tests.
        // idle: fires when the server sends RequestRendererIdle (UI is stable).
        // blink: fires when the caret blink timer toggles visibility.

        document.addEventListener('DOMContentLoaded', async () => {
            const gacuiScreen = document.getElementById('gacui-screen');
            const errorMask = document.getElementById('gacui-error-mask');
            const successMask = document.getElementById('gacui-success-mask');
            const errorMessage = document.getElementById('gacui-error-message');
            const successMessage = document.getElementById('gacui-success-message');

            const getMessage = (error) => error instanceof Error ? error.message : String(error);
            const showMask = (mask, messageElement, message) => {
                messageElement.textContent = message;
                gacuiScreen.appendChild(mask);
                mask.classList.add('visible');
            };

            const settings = {
                target: gacuiScreen,
                isShortcutReservedForBrowser: GacUIHtmlRenderer.isShortcutReservedForBrowser,
                suggestMinSize: (x, y) => {
                    if (x < 320) x = 320;
                    if (y < 240) y = 240;
                    gacuiScreen.style.width = `clamp(${x}px, calc(100vw - 40px), 1280px)`;
                    gacuiScreen.style.height = `clamp(${y}px, calc(100vh - 80px), 960px)`;
                },
                idle: () => {
                    if (typeof window.__gacui_playwright_idle === 'function') {
                        window.__gacui_playwright_idle();
                    }
                },
                blink: () => {
                    if (typeof window.__gacui_playwright_blink === 'function') {
                        window.__gacui_playwright_blink();
                    }
                }
            };

            // Disable context menu on the gacui-screen and all its child elements
            gacuiScreen.addEventListener('contextmenu', (event) => {
                event.preventDefault();
                return false;
            });

            // Focus the element to enable keyboard events
            gacuiScreen.focus();

            // Ensure gacui-screen gets focus when user clicks anywhere on the page
            document.addEventListener('click', (event) => {
                // Only focus if the click target is not a naturally focusable element
                const target = event.target;
                const tagName = target.tagName.toLowerCase();
                const isFocusableElement = ['input', 'button', 'select', 'textarea', 'a'].includes(tagName) ||
                    target.hasAttribute('tabindex');

                if (!isFocusableElement) {
                    gacuiScreen.focus();
                }
            });

            let renderer;
            let client;
            let session;
            let disposeClocks;
            let pageHidden = false;
            let keepRvmHost = false;
            window.addEventListener('pagehide', () => {
                pageHidden = true;
                disposeClocks?.();
                if (session) {
                    session.stop();
                } else {
                    renderer?.stop();
                    client?.stop();
                }
                delete window.__gacui_rvmhost_session;
            }, { once: true });
            try {
                const rvmhost = connection.rvmhost;
                if (rvmhost) {
                    session = GacUIHtmlRenderer.runRvmGacUI(settings, { connection });
                    window.__gacui_rvmhost_session = session;
                    void session.hostOutcome.then(() => session.stop());
                    await session.startup;
                    renderer = session.renderer;
                    client = session.rendererClient;
                } else {
                    [renderer, client] = await GacUIHtmlRenderer.runGacUI(settings, connection);
                }
                if (pageHidden) return;
                gacuiRenderer = renderer;
                disposeClocks = installFullControlTestRawElements(renderer);
                settings.suggestMinSize(0, 0);
                if (session) {
                    await session.completion;
                } else {
                    await client.start();
                }
            } catch (error) {
                if (pageHidden) return;
                if (error instanceof GacUIHtmlRenderer.GacUIHtmlRendererExitError ||
                    error instanceof GacUIHtmlRenderer.RemoteProtocolHttpDisconnectError) {
                    // Renderer takeover does not release Core's accepted view-model host.
                    keepRvmHost = session !== undefined;
                    showMask(successMask, successMessage, getMessage(error));
                } else {
                    showMask(errorMask, errorMessage, getMessage(error));
                    throw error;
                }

            } finally {
                disposeClocks?.();
                if (session && (!keepRvmHost || pageHidden)) session.stop();
                else {
                    client?.stop();
                    renderer?.stop();
                }
            }
        });
    </script>
</body>

</html>
