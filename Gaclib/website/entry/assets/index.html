<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <title>GacUI HTML Renderer</title>
    <link rel="shortcut icon" href="/favicon.ico" />
    <link rel="stylesheet" type="text/css" href="./global.css" />
    <script src="/index.js"></script>
</head>

<body>
    <div id="gacui-screen" class="gacui-container" tabindex="0">
        <!-- Content goes here -->
    </div>
    <button onclick="gacuiRenderer.requestStopToCore(false)">Exit</button>
    <button onclick="gacuiRenderer.requestStopToCore(true)">Force Exit</button>

    <div id="gacui-error-mask" class="gacui-error-mask">
        <div class="gacui-error-cross"></div>
        <div id="gacui-error-message" class="gacui-mask-message"></div>
    </div>
    <div id="gacui-success-mask" class="gacui-success-mask">
        <div class="gacui-success-tick"></div>
        <div id="gacui-success-message" class="gacui-mask-message"></div>
    </div>
    <script lang="javascript">
        let gacuiRenderer;

        // Event bridges for Playwright tests.
        // idle: fires when the server sends RequestRendererIdle (UI is stable).
        // blink: fires when the caret blink timer toggles visibility.

        document.addEventListener('DOMContentLoaded', async () => {
            const gacuiScreen = document.getElementById('gacui-screen');
            const errorMask = document.getElementById('gacui-error-mask');
            const successMask = document.getElementById('gacui-success-mask');
            const errorMessage = document.getElementById('gacui-error-message');
            const successMessage = document.getElementById('gacui-success-message');

            const getMessage = (error) => error instanceof Error ? error.message : String(error);
            const showMask = (mask, messageElement, message) => {
                messageElement.textContent = message;
                gacuiScreen.appendChild(mask);
                mask.classList.add('visible');
            };

            const settings = {
                target: gacuiScreen,
                isShortcutReservedForBrowser: GacUIHtmlRenderer.isShortcutReservedForBrowser,
                suggestMinSize: (x, y) => {
                    if (x < 320) x = 320;
                    if (y < 240) y = 240;
                    gacuiScreen.style.width = `clamp(${x}px, calc(100vw - 40px), 1280px)`;
                    gacuiScreen.style.height = `clamp(${y}px, calc(100vh - 80px), 960px)`;
                },
                idle: () => {
                    if (typeof window.__gacui_playwright_idle === 'function') {
                        window.__gacui_playwright_idle();
                    }
                },
                blink: () => {
                    if (typeof window.__gacui_playwright_blink === 'function') {
                        window.__gacui_playwright_blink();
                    }
                }
            };

            // Disable context menu on the gacui-screen and all its child elements
            gacuiScreen.addEventListener('contextmenu', (event) => {
                event.preventDefault();
                return false;
            });

            // Focus the element to enable keyboard events
            gacuiScreen.focus();

            // Ensure gacui-screen gets focus when user clicks anywhere on the page
            document.addEventListener('click', (event) => {
                // Only focus if the click target is not a naturally focusable element
                const target = event.target;
                const tagName = target.tagName.toLowerCase();
                const isFocusableElement = ['input', 'button', 'select', 'textarea', 'a'].includes(tagName) ||
                    target.hasAttribute('tabindex');

                if (!isFocusableElement) {
                    gacuiScreen.focus();
                }
            });

            const [renderer, client] = await GacUIHtmlRenderer.runGacUI(settings);
            gacuiRenderer = renderer;

            try {
                settings.suggestMinSize(0, 0);
                await client.start();
            } catch (error) {
                client.stop();
                renderer.stop();

                if (error instanceof GacUIHtmlRenderer.GacUIHtmlRendererExitError ||
                    error instanceof GacUIHtmlRenderer.RemoteProtocolHttpDisconnectError) {
                    showMask(successMask, successMessage, getMessage(error));
                } else {
                    showMask(errorMask, errorMessage, getMessage(error));
                    throw error;
                }

            }
        });
    </script>
</body>

</html>
